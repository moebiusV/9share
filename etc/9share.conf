# 9share.conf -- the machine-wide configuration of 9share (see 9share.conf(5)).
#
# Nothing is shared and nothing is mounted until you say so; 9share is running and waiting.
#
# To set up the usual case, run:
#
#     9share setup
#
# It asks a few questions and writes the configuration for you.  What it writes is simple:
#
# - On the machine that HAS the files, each user's own file, ~/.config/9share/9share.conf, holds
#   one `export` block for each directory shared:
#
#       export "projects" {
#           directory "/srv/projects"
#           host "laptop.example.org"
#       }
#
# - On the machine that SHOWS the files, this file holds one `mount` block for each directory shown
#   (`sudo 9share mount USER NAME DIR` adds it):
#
#       mount "projects" {
#           user "alice"
#           at "/mnt/projects"
#       }
#
# `hold N` in either block sets how many seconds a mount waits for a dropped connection to come back
# (1 to 86400; the default is 600).  Lines that begin with # are comments.
